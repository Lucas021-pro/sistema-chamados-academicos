<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headTailwind('Novo Chamado | Gestão de Chamados Acadêmicos')}"></head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

<header th:replace="~{fragments/layout :: cabecalhoModerno('chamados')}"></header>

<section class="panel">
    <div class="max-w-5xl mx-auto px-4 py-6">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <h1 class="text-xl font-semibold">Abrir novo chamado</h1>
            <a href="/chamados"
               class="px-3.5 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium">
                Voltar para a lista
            </a>
        </div>

        <div th:replace="~{fragments/layout :: mensagensModernas}"></div>

        <div class="grid lg:grid-cols-[1fr_300px] gap-6 items-start">
            <form th:action="@{/chamados/salvar}"
                  th:object="${chamadoCadastroDTO}"
                  method="post"
                  class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 space-y-5">

                <input type="hidden" id="categoriaInput" th:field="*{categoria}"/>

                <fieldset>
                    <legend class="text-sm font-medium mb-2 flex items-center gap-2">
                        Qual o assunto? <span class="text-red-600" aria-hidden="true">*</span>
                    </legend>
                    <div role="radiogroup" aria-label="Categoria" class="grid grid-cols-2 sm:grid-cols-4 gap-2"
                         id="cats">
                        <button type="button"
                                role="radio"
                                aria-checked="false"
                                data-val="Matrícula"
                                data-p="Alta"
                                data-sla="1 dia útil"
                                data-team="Coordenação de Curso"
                                class="cat text-left p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 transition">
                            <svg class="text-blue-600 mb-2" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M22 10 12 5 2 10l10 5 10-5z"/>
                                <path d="M6 12v5c3 2 9 2 12 0v-5"/>
                            </svg>
                            <div class="text-sm font-medium">Matrícula</div>
                            <div class="text-xs text-slate-500 dark:text-slate-400">Ajustes, trancamento</div>
                        </button>

                        <button type="button"
                                role="radio"
                                aria-checked="false"
                                data-val="Documentos"
                                data-p="Média"
                                data-sla="3 dias úteis"
                                data-team="Secretaria Acadêmica"
                                class="cat text-left p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 transition">
                            <svg class="text-blue-600 mb-2" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                                <path d="M14 3v6h6M8 13h8M8 17h5"/>
                            </svg>
                            <div class="text-sm font-medium">Documentos</div>
                            <div class="text-xs text-slate-500 dark:text-slate-400">Declarações, histórico</div>
                        </button>

                        <button type="button"
                                role="radio"
                                aria-checked="false"
                                data-val="Suporte técnico"
                                data-p="Alta"
                                data-sla="4 horas"
                                data-team="Equipe de TI"
                                class="cat text-left p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 transition">
                            <svg class="text-blue-600 mb-2" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <rect x="2" y="4" width="20" height="13" rx="2"/>
                                <path d="M8 21h8M12 17v4"/>
                            </svg>
                            <div class="text-sm font-medium">Suporte técnico</div>
                            <div class="text-xs text-slate-500 dark:text-slate-400">Laboratórios, sistemas</div>
                        </button>

                        <button type="button"
                                role="radio"
                                aria-checked="false"
                                data-val="Atendimento acadêmico"
                                data-p="Baixa"
                                data-sla="2 dias úteis"
                                data-team="Atendimento Geral"
                                class="cat text-left p-3 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 transition">
                            <svg class="text-blue-600 mb-2" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                            <div class="text-sm font-medium">Atendimento</div>
                            <div class="text-xs text-slate-500 dark:text-slate-400">Dúvidas gerais</div>
                        </button>
                    </div>
                    <p th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"
                       class="text-xs text-red-600 dark:text-red-400 mt-1.5"></p>
                </fieldset>

                <div>
                    <label for="titulo" class="text-sm font-medium">
                        Título <span class="text-red-600" aria-hidden="true">*</span>
                    </label>
                    <input id="titulo"
                           th:field="*{titulo}"
                           required
                           maxlength="120"
                           placeholder="Ex.: Solicitação de histórico escolar"
                           class="field mt-1.5 w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm"/>
                    <p th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"
                       class="text-xs text-red-600 dark:text-red-400 mt-1"></p>
                </div>

                <div>
                    <div class="flex items-center justify-between">
                        <label for="desc" class="text-sm font-medium">
                            Descrição <span class="text-red-600" aria-hidden="true">*</span>
                        </label>
                        <span id="descCount" class="text-xs text-slate-400" aria-live="polite">0/500</span>
                    </div>
                    <textarea id="desc"
                              th:field="*{descricao}"
                              required
                              maxlength="500"
                              rows="5"
                              aria-describedby="descHint"
                              placeholder="O que aconteceu, quando e o que você já tentou."
                              class="field mt-1.5 w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm"></textarea>
                    <p id="descHint" class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        Inclua sua matrícula, disciplina ou sala, se aplicável.
                    </p>
                    <p th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"
                       class="text-xs text-red-600 dark:text-red-400 mt-1"></p>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <a href="/chamados"
                       class="px-4 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                        Cancelar
                    </a>
                    <button type="submit"
                            class="px-4 py-2 rounded-lg text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium">
                        Abrir chamado
                    </button>
                </div>
            </form>

            <aside class="space-y-4">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4"
                     aria-live="polite">
                    <div class="text-sm font-semibold">Resumo do atendimento</div>
                    <div id="summaryEmpty" class="text-sm text-slate-500 dark:text-slate-400 mt-2">
                        Escolha um assunto para ver prioridade, prazo e equipe responsável.
                    </div>
                    <dl id="summary" class="hidden mt-3 space-y-2 text-sm">
                        <div class="flex justify-between">
                            <dt class="text-slate-500 dark:text-slate-400">Prioridade inicial</dt>
                            <dd id="sP" class="font-medium"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-slate-500 dark:text-slate-400">Prazo estimado</dt>
                            <dd id="sS" class="font-medium"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-slate-500 dark:text-slate-400">Encaminhado para</dt>
                            <dd id="sT" class="font-medium text-right"></dd>
                        </div>
                    </dl>
                </div>
            </aside>
        </div>
    </div>
</section>

<script>
    const catInput = document.getElementById('categoriaInput');
    const pBadge = {
        'Alta': 'text-orange-600 dark:text-orange-400',
        'Baixa': 'text-slate-600 dark:text-slate-300',
        'Média': 'text-yellow-700 dark:text-amber-400'
    };

    const classesAtivas = ['border-blue-600', 'ring-1', 'ring-blue-600', 'bg-blue-50/70', 'dark:border-blue-500', 'dark:ring-blue-500', 'dark:bg-blue-950/30'];
    const classesInativas = ['border-slate-200', 'dark:border-slate-700'];

    function selecionarCat(b) {
        document.querySelectorAll('.cat').forEach(x => {
            const ativo = x === b;
            x.setAttribute('aria-checked', String(ativo));
            x.classList.remove(...(ativo ? classesInativas : classesAtivas));
            x.classList.add(...(ativo ? classesAtivas : classesInativas));
        });
        catInput.value = b.dataset.val;
        document.getElementById('summaryEmpty').classList.add('hidden');
        document.getElementById('summary').classList.remove('hidden');
        const sp = document.getElementById('sP');
        sp.textContent = b.dataset.p;
        sp.className = 'font-medium ' + (pBadge[b.dataset.p] || '');
        document.getElementById('sS').textContent = b.dataset.sla;
        document.getElementById('sT').textContent = b.dataset.team;
    }

    document.querySelectorAll('.cat').forEach(b => b.addEventListener('click', () => selecionarCat(b)));

    if (catInput.value) {
        const atual = Array.from(document.querySelectorAll('.cat')).find(b => b.dataset.val === catInput.value);
        if (atual) selecionarCat(atual);
    }

    const desc = document.getElementById('desc');
    const descCount = document.getElementById('descCount');

    function atualizarContador() {
        descCount.textContent = `${desc.value.length}/500`;
    }

    desc.addEventListener('input', atualizarContador);
    atualizarContador();
</script>
</body>
</html>
